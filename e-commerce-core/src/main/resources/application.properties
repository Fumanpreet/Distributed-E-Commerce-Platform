spring.application.name=e-commerce-core
server.servlet.session.tracking-modes=cookie

# Microservices ENDPOINTS
services.inventory.base-url= ${INVENTORY_BASE_URL:http://localhost:8081}
services.checkout.base-url= ${CHECKOUT_BASE_URL:http://localhost:8082}

# Password encryption strength
security.bcrypt.strength=12


# Oracle
# Driver class
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JDBC Connection URL (Paste the exact long string you copied between the brackets)
spring.datasource.url=${CORE_DB_URL}


# Credentials
spring.datasource.username=${CORE_DB_USERNAME}
spring.datasource.password=${CORE_DB_PASSWORD}

# Hibernate and JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Mongodb
spring.mongodb.uri=${CORE_MONGODB_URI}


